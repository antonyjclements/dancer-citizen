standards:
  - path: docs/standards/aws/build-react-before-cdk-synth.md
    description: Build React before CDK synth or deploy
    applies_to:
      - infra/lib/dancer-citizen-web-stack.ts
      - apps/react-site/**
      - README.md
      - package.json
    tags:
      - aws
      - deployment
      - react
  - path: docs/standards/aws/html-shell-metadata-from-cms.md
    description: Render AWS HTML shell metadata from CMS normalization
    applies_to:
      - apps/cms-api/src/html-shell.ts
      - apps/cms-api/src/content.ts
      - apps/react-site/index.html
      - infra/lib/dancer-citizen-web-stack.ts
