      - aws
      - metadata
      - seo
  - path: docs/standards/frontend/prevent-mobile-content-overflow.md
    description: Prevent CMS content from widening mobile viewports
    applies_to:
      - src/foundation/rich-text/**
      - src/features/**/components/**
      - apps/react-site/src/components/**
      - apps/react-site/src/pages/**
      - apps/react-site/src/styles.css
    tags:
      - frontend
      - mobile
      - rich-text
  - path: docs/standards/react/keep-react-pages-on-cms-api-boundary.md
    description: Keep React pages behind the CMS API boundary
    applies_to:
      - apps/react-site/src/api.ts
      - apps/react-site/src/hooks.ts
      - apps/react-site/src/pages/**
      - apps/cms-api/src/content.ts
