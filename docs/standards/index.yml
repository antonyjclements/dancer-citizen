      - slices
      - migration
  - path: docs/standards/react/make-mobile-navigation-accessible.md
    description: Make mobile shell navigation accessible
    applies_to:
      - src/foundation/layout/SiteHeader.tsx
      - apps/react-site/src/App.tsx
      - apps/react-site/src/styles.css
