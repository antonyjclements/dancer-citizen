      - navigation
      - accessibility
  - path: docs/standards/react/own-spa-navigation-reset.md
    description: Reset React SPA scroll at the shell boundary
    applies_to:
      - apps/react-site/src/App.tsx
      - apps/react-site/src/pages/**
    tags:
      - react
      - navigation
      - accessibility
  - path: docs/standards/react/use-skeletons-for-content-loading.md
    description: Use skeletons for React content loading
    applies_to:
      - apps/react-site/src/components/Loading.tsx
      - apps/react-site/src/hooks.ts
      - apps/react-site/src/pages/**
      - apps/react-site/src/styles.css
